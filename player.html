<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>チキンレース(子)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="enter" class="center" hidden>
    <div class="card">
      <h1>チキンレース <span class="muted small-text">参加</span></h1>
      <p class="muted small-text">親から伝えられたルームコードを入力してください。</p>
      <input class="inp" id="roomInput" maxlength="8" placeholder="ルームコード(例: AB12CD)" autocomplete="off">
      <button class="btn primary big" id="roomGo">次へ</button>
    </div>
  </div>

  <div id="join" class="center" hidden>
    <div class="card">
      <h1>ルーム <span id="joinRoom" class="now"></span></h1>
      <p class="muted small-text" id="joinMsg"></p>
      <div id="joinForm" hidden>
        <div class="choice">
          <h3 class="muted small-text">新しく参加する</h3>
          <div class="row">
            <input class="inp grow" id="nameInput" maxlength="12" placeholder="名前(12文字まで)" autocomplete="off">
            <button class="btn primary" id="joinGo">参加</button>
          </div>
        </div>
        <div class="choice" id="resumeBox" style="margin-top:16px"></div>
        <div class="row" style="margin-top:16px"><button class="btn" id="watchGo">観戦のみ</button></div>
      </div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">チキンレース<span class="role">子</span></div>
      <div class="roominfo">
        ルーム <b id="roomCode"></b>
        <span id="meInfo"></span>
        <button class="btn small" id="leave">切替</button>
        <span class="badge bad" id="offline" hidden>接続が切れています</span>
      </div>
      <div class="phase" id="phase"></div>
    </header>
    <div class="main">
      <div class="stage"><canvas id="board"></canvas></div>
      <aside class="side">
        <div class="panel" id="panel"></div>
      </aside>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/board.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
